[project]
name = "kgaml"
version = "0.1.0"
description = "Knowledge graph enrichment for leakage-free illicit Bitcoin transaction detection (Elliptic++)"
readme = "README.md"
authors = [{ name = "S Muhammad Taha Abbas Naqvi" }]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.54.1",
    "torch>=2.15.0",
    "torch-geometric>=2.8.1",
    "tqdm>=4.70.1",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

# CPU-only PyTorch wheels (no GPU on the development machine).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
